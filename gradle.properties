#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Xcode versions newer than the one the Kotlin Gradle Plugin was tested against are fine for this project.
kotlin.apple.xcodeCompatibility.nowarn=true

#Gradle
# Publish only the md5 and sha1 checksums that Maven Central requires, instead of also
# emitting sha256 and sha512, which doubles the number of files in a deployment.
systemProp.org.gradle.internal.publish.checksums.insecure=true
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
